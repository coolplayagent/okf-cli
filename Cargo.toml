[workspace]
members = ["apps/okf-cli", "crates/okf-core", "crates/okf-application", "crates/okf-adapters"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
okf-core = { path = "crates/okf-core" }
okf-application = { path = "crates/okf-application" }
okf-adapters = { path = "crates/okf-adapters" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
ctrlc = "3.5"
tempfile = "3"
dirs = "6"
