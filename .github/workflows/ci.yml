name: CLI checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install -r scripts/requirements-test.txt
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --all-targets --release --locked
      - run: cargo build --release -p okf-cli --locked
      - run: cargo run -p okf-cli --locked -- --help
      - if: runner.os != 'Windows'
        run: python scripts/check_delivery.py target/release/okf
      - if: runner.os == 'Windows'
        run: python scripts/check_delivery.py target/release/okf.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-${{ runner.os }}-${{ runner.arch }}
          path: target/verification/retrieval.json
          if-no-files-found: ignore
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
