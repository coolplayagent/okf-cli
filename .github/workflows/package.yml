name: Package binaries
on:
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create a draft release after validation (select a version tag)
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      OKF_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release request
        if: inputs.create_draft && github.ref_type != 'tag'
        run: exit 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install -r scripts/requirements-test.txt
      - run: cargo test --workspace --all-targets --release --locked
      - run: cargo build --release --locked -p okf-cli
      - uses: actions/checkout@v4
        with:
          ref: cae1cff309941735326fcdb79b953c640150ae23
          path: target/upgrade-baseline
      - run: cargo build --release --locked --manifest-path target/upgrade-baseline/Cargo.toml --target-dir target/upgrade-target -p okf-cli
      - if: runner.os != 'Windows'
        run: |
          python scripts/check_runtime.py target/release/okf target/verification/runtime.json
          python scripts/check_upgrade.py target/upgrade-target/release/okf target/release/okf
      - if: runner.os == 'Windows'
        run: |
          python scripts/check_runtime.py target/release/okf.exe target/verification/runtime.json
          python scripts/check_upgrade.py target/upgrade-target/release/okf.exe target/release/okf.exe
      - if: runner.os != 'Windows'
        run: |
          python scripts/check_delivery.py target/release/okf
      - if: runner.os == 'Windows'
        run: |
          python scripts/check_delivery.py target/release/okf.exe
      - uses: actions/upload-artifact@v4
        with:
          name: okf-cli-${{ runner.os }}-${{ runner.arch }}
          path: target/dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/verification/retrieval.json
            target/verification/multi-bundle.json
            target/verification/budgets.json
            target/verification/consumption.json
            target/verification/upstream-local.json
            target/verification/runtime.json
            target/verification/https/
          if-no-files-found: ignore
  draft:
    if: github.event_name == 'workflow_dispatch' && inputs.create_draft && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: okf-cli-*
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 --draft --verify-tag --title "$RELEASE_TAG" --generate-notes
