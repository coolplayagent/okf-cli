name: Upstream compatibility report
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/check_upstream.py target/verification/upstream.json --online
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-compatibility
          path: target/verification/upstream.json
